# MorfoFinP — gera o app Android (.apk) na nuvem do GitHub (09/09/2026).
#
# Por quê aqui: o ambiente de nuvem onde o código é escrito não consegue baixar
# o SDK do Android (rede bloqueada), e o Rafael escolheu não instalar o Android
# Studio no PC. Cada vez que o código é publicado no GitHub (branch main), este
# fluxo:
#   1. instala Node + Java 21 + SDK do Android
#   2. faz o build web (vite build → dist/)
#   3. gera o projeto Android do zero (npx cap add android — a pasta android/
#      nunca é versionada, ver .gitignore) e sincroniza o plugin de
#      notificação bancária (plugins/notificacao-bancaria)
#   4. compila o .apk de DEBUG (instalável direto no celular, sem loja)
#   5. publica o .apk como Release "build-NNN" (aba Releases do repositório)
#      e também como artefato do workflow
#
# O número NNN vem de src/buildInfo.ts (BUILD_NUMBER) — mesmo contador do
# MorfoFinP.html / MorfoFinP-build-NNN.zip (Decisão 33, G52).
#
# Também pode ser disparado à mão: aba Actions → "Android (.apk)" → Run workflow.
name: Android (.apk)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21 (exigido pelo Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Número do build (src/buildInfo.ts)
        id: build
        run: |
          N=$(grep -oP "BUILD_NUMBER\s*=\s*\K\d+" src/buildInfo.ts)
          V=$(grep -oP "VERSAO\s*=\s*'\K[^']+" src/buildInfo.ts)
          printf -v NNN "%03d" "$N"
          echo "numero=$N" >> "$GITHUB_OUTPUT"
          echo "nnn=$NNN" >> "$GITHUB_OUTPUT"
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "Build $NNN (v$V)"

      - name: Dependências
        # `npm install` (não `npm ci`): funciona com ou sem package-lock.json
        # no repositório (o zip publicado pode ou não levar o lock).
        run: npm install --no-audit --no-fund

      - name: Build web (dist/)
        run: npx vite build

      - name: Chave de assinatura fixa (debug)
        # Sem isto, cada execução gera um debug.keystore NOVO e o Android recusa
        # instalar um build por cima do anterior ("o pacote tem conflito com um
        # já instalado" — obriga a desinstalar e perder os dados). A chave em
        # android-signing/ é a chave de DEBUG padrão do Android (alias
        # androiddebugkey, senha "android"), versionada de propósito: serve só
        # pra atualizar o app de teste no celular.
        #
        # 10/09/2026 — copiar pra ~/.android NÃO bastava: o Gradle procura o
        # keystore de debug em $ANDROID_USER_HOME, depois em
        # $ANDROID_SDK_HOME/.android e só então em ~/.android, e o runner do
        # GitHub define essas variáveis apontando pra dentro do SDK. Quando ele
        # não acha, GERA UMA CHAVE NOVA em silêncio — build seguinte já não
        # instala por cima. Por isso agora, além da cópia, a assinatura é
        # declarada explicitamente no build.gradle (passo abaixo), apontando
        # direto pro arquivo do repositório: não depende de variável de
        # ambiente nenhuma.
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$HOME" >> "$GITHUB_ENV"

      - name: Gerar projeto Android + sincronizar plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone do app (símbolo Morfo)
        # A pasta android/ é gerada do zero a cada execução, então os ícones do
        # template do Capacitor (o robozinho padrão) voltam sempre. Este passo
        # copia por cima os ícones do MorfoFinP, versionados em android-icons/res
        # (gerados a partir de public/icons/icon-512.png — o mesmo símbolo Morfo
        # que a PWA usa — pelo script android-icons/gerar-icones.py).
        #
        # Falha ruidosamente se algum arquivo de destino não existir: isso
        # significaria que o template do Capacitor mudou de estrutura e os
        # ícones estariam sendo copiados pra um lugar que ninguém lê — exatamente
        # o tipo de passo que "roda sem erro" e não tem efeito no .apk.
        run: |
          python3 - <<'PY'
          import os, shutil, sys
          origem = 'android-icons/res'
          destino = 'android/app/src/main/res'
          copiados, faltando = [], []
          for raiz, _, arquivos in os.walk(origem):
              for nome in arquivos:
                  rel = os.path.relpath(os.path.join(raiz, nome), origem)
                  alvo = os.path.join(destino, rel)
                  if not os.path.exists(alvo):
                      faltando.append(rel)
                      continue
                  shutil.copyfile(os.path.join(origem, rel), alvo)
                  copiados.append(rel)
          if faltando:
              sys.exit('Estes arquivos NAO existem no projeto gerado (o template do '
                       'Capacitor mudou?): ' + ', '.join(sorted(faltando)))
          print(f'{len(copiados)} icone(s) copiado(s):')
          for rel in sorted(copiados):
              print(' ', rel, os.path.getsize(os.path.join(destino, rel)), 'bytes')
          PY

      - name: Fixar a assinatura de debug no build.gradle
        # A pasta android/ é gerada do zero a cada execução (não é versionada),
        # então este passo reescreve o build.gradle recém-criado. Sem isso, o
        # `signingConfig` de debug é o padrão do Gradle, que aponta pra um
        # caminho de máquina — e é justamente ele que muda de execução pra
        # execução. Falha ruidosamente se não achar o bloco `android {`.
        run: |
          python3 - <<'PY'
          import re, sys
          caminho = 'android/app/build.gradle'
          fonte = open(caminho, encoding='utf-8').read()
          bloco = '''
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../android-signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          novo, n = re.subn(r'(?m)^android \{\s*$', 'android {\n' + bloco, fonte, count=1)
          if n != 1:
              sys.exit('NAO ACHEI o bloco "android {" em ' + caminho)
          open(caminho, 'w', encoding='utf-8').write(novo)
          print(novo[:900])
          PY

      - name: Carimbar versão do app (versionCode/versionName)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ steps.build.outputs.numero }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.build.outputs.versao }}.${{ steps.build.outputs.nnn }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilar .apk (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Qual chave o Gradle usou (evidência no log)
        # `signingReport` imprime, por variante, o arquivo de keystore, o alias
        # e a impressão digital que o Gradle REALMENTE usou. É o que diz, sem
        # adivinhação, se o signingConfig injetado acima pegou ou se ele caiu
        # no keystore de debug gerado na hora.
        run: |
          cd android
          ./gradlew :app:signingReport --no-daemon | sed -n '/Variant: debug/,/^$/p' || true

      - name: Renomear .apk
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/debug/app-debug.apk "saida/MorfoFinP-build-${{ steps.build.outputs.nnn }}.apk"
          ls -la saida

      - name: Impressão digital do certificado (tem que ser SEMPRE a mesma)
        # Evidência, não suposição: se esta digital mudar de um build pro outro,
        # o celular recusa instalar por cima ("o pacote tem conflito com um já
        # instalado"). A esperada é a da chave versionada em
        # android-signing/debug.keystore (SHA-1, minúsculo, sem separador).
        #
        # Usa `apksigner`, não `keytool -printcert -jarfile`: o keytool só lê a
        # assinatura v1 (JAR), que o AGP nem sempre inclui — num .apk assinado
        # só em v2/v3 ele não devolve digital nenhuma e a comparação acusaria
        # divergência que não existe. O apksigner lê os três esquemas.
        run: |
          APK="saida/MorfoFinP-build-${{ steps.build.outputs.nnn }}.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs -v "$APK" || true
          ESPERADA="ce55d43227f993d527fd99d1382f090a964d2449"
          ATUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1 digest" | head -1 | sed 's/.*: *//' | tr 'A-F' 'a-f' | tr -d ' :\r')
          echo "esperada: $ESPERADA"
          echo "atual:    $ATUAL"
          test -n "$ATUAL" || { echo "::error::Não consegui ler a assinatura do .apk (apksigner não devolveu digital)."; exit 1; }
          test "$ATUAL" = "$ESPERADA" || { echo "::error::O .apk foi assinado com uma chave DIFERENTE da versionada — ele não instalaria por cima do build anterior."; exit 1; }
          echo "Assinatura confere."

      - name: Publicar como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: MorfoFinP-build-${{ steps.build.outputs.nnn }}-apk
          path: saida/*.apk

      - name: Publicar como Release (build-${{ steps.build.outputs.nnn }})
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.nnn }}
          name: MorfoFinP build ${{ steps.build.outputs.nnn }} (Android)
          body: |
            App Android de teste (debug) do MorfoFinP — build ${{ steps.build.outputs.nnn }}, v${{ steps.build.outputs.versao }}.
            Baixe o .apk no celular, permita "instalar de fontes desconhecidas" e abra.
            Depois, no app: engrenagem → Notificações bancárias → ligar acesso às notificações.
          files: saida/*.apk
