         nunca recortando/alterando o bloco abaixo (a regra proíbe cópia parcial;

    <style id="shell-morfo">
/* CSS do shell (index.html) que o Kit `.jsx` espera — Morfo
   Fonte: build real do MorfoLoc (morfoloc-mvp-63.190.html), extraído em 10/09 (G69, varredura completa
   depois do achado do chat/badge-pulse — G68).

   POR QUE ESTE ARQUIVO EXISTE: o Kit `.jsx` é só o componente React — ele referencia, por nome, um
   conjunto de classes/variáveis CSS que NUNCA foram capturadas na clonagem do MorfoLoc (mesma causa-raiz
   do favicon/manifest/PWA-ícone). Sem este bloco carregado no `<style>` do build, essas classes existem
   no código mas não fazem NADA — sem erro, sem aviso, só "não funciona" — e só aparece quando alguém usa
   a tela certa (troca de tema, modo web, tela de bloqueio, chat com msg não lida). Colar este arquivo
   inteiro (ou seu conteúdo, dentro de um <style>) no `index.html`/build de TODO produto, sempre — nunca
   parcial, nunca "só o que parece relevante agora".

   Cobre, nesta ordem: reset de rolagem/scrollbar, animação de chat não lida, modo de área simulada WEB
   (cartela central), sistema de tema claro/escuro (variáveis --mloc-*), telas "sempre claras" (Login/site),
   N0 "sempre escuro", reset de <button> e herança de cor. */

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F7F5F2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: pan-y; }
#root { height: 100%; overflow: hidden; }
* { box-sizing: border-box; }

/* premissa do produto: nunca mostrar barra de rolagem, clara ou escura */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }

/* Indicador de mensagem não lida (chat): badge vermelho com "!" + ícone/botão treme (shake) enquanto
   houver não lida. */
@keyframes mlocShake {
  0%, 100% { transform: rotate(0deg); }
  15% { transform: rotate(-11deg); }
  30% { transform: rotate(9deg); }
  45% { transform: rotate(-7deg); }
  60% { transform: rotate(5deg); }
  75% { transform: rotate(-2deg); }
  90% { transform: rotate(1deg); }
}
.mloc-shake { animation: mlocShake 1.8s ease-in-out infinite; transform-origin: 50% 30%; }
@keyframes mlocPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(224,45,45,0.55); }
  50% { box-shadow: 0 0 0 5px rgba(224,45,45,0); }
}
.mloc-badge-pulse { animation: mlocPulse 1.4s ease-out infinite; }

/* Modo de área simulada WEB (botão 🖥️ do Login/N1/N0): telas secundárias/sheets viram CARTELA central
   com borda, sombra e cantos arredondados, em vez de ocupar o navegador inteiro. */
.mloc-area-web .mloc-tela-cheia {
  --mloc-tela-top: 22px;
  --mloc-tela-bottom: 22px;
  --mloc-tela-maxw: 820px;
  --mloc-tela-radius: 16px;
  --mloc-tela-border: 1px solid rgba(127,127,127,0.4);
  --mloc-tela-shadow: 0 18px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.08);
}
.mloc-area-web .mloc-tela-cheia::before {
  content: "";
  position: fixed;
  top: 0; bottom: 0; left: 0; right: 0;
  z-index: -1;
}
.mloc-area-web { --mloc-sheet-maxw: 560px; }
/* modo web: telas sempre-claras de página inteira (Login e afins) viram coluna central de leitura
   (~500px) em vez de esticar os campos pela tela toda — o fundo (gradiente) continua ocupando o navegador
   inteiro; o chrome do site web (cabeçalho/menu/conteúdo, .mloc-site-full) escapa dessa coluna e ocupa a
   largura total. */
.mloc-area-web .mloc-sempre-claro > * { width: 100%; max-width: 500px; margin-left: auto; margin-right: auto; }
.mloc-area-web .mloc-sempre-claro > .mloc-site-full { max-width: none; margin-left: 0; margin-right: 0; }

/* ---- Sistema de tema claro/escuro ----
   As constantes de cor do app (INK/PAPER/PURPLE/etc.) apontam pra estas variáveis (o hex antigo continua
   como fallback no JS, então nada quebra sem este bloco — só o toggle de tema não faz nada visível).
   Sem atributo no <html> vale "auto": segue o sistema. data-mloc-tema="claro"/"escuro" força um dos dois. */
:root {
  --mloc-ink: #1C1B22;  --mloc-paper: #F7F5F2;  --mloc-line: #E7E3DC;
  --mloc-purple: #5E2E97; --mloc-purple-deep: #6214A8; --mloc-coral: #E8825A;
  --mloc-green: #2E9E5B; --mloc-amber: #D9A227; --mloc-red: #D2483B;
  --mloc-dev-bg: #141319; --mloc-dev-card: #201E28; --mloc-dev-accent: #6C3FFF;
  --mloc-branco: #FFFFFF;
  --mloc-text2: #6B6558; --mloc-text3: #736E63; --mloc-grid: #EDEAE2;
  --mloc-soft: #00000008; --mloc-toggle-off: #D8D3C8;
  --mloc-accent: #6C3FFF;
  --mloc-quickaction: #1C1B22;
  --mloc-toast: #1C1B22;
}
html[data-mloc-tema="escuro"],
html[data-mloc-tema="escuro"] body {
  --mloc-ink: #F2F0F5;  --mloc-paper: #17161C;  --mloc-line: #2E2C36;
  --mloc-purple: #8357DE; --mloc-purple-deep: #8A66EA; --mloc-coral: #F0996F;
  --mloc-green: #46B87A; --mloc-amber: #E0B450; --mloc-red: #E86B5E;
  --mloc-branco: #201E28;
  --mloc-text2: #B9B4C6; --mloc-text3: #948FA3; --mloc-grid: #2A2833;
  --mloc-soft: rgba(255,255,255,0.07); --mloc-toggle-off: #3A3744;
  --mloc-quickaction: #2A2833;
  --mloc-toast: #3A3744;
  background: #17161C;
}
@media (prefers-color-scheme: dark) {
  html:not([data-mloc-tema="claro"]),
  html:not([data-mloc-tema="claro"]) body {
    --mloc-ink: #F2F0F5;  --mloc-paper: #17161C;  --mloc-line: #2E2C36;
    --mloc-purple: #8357DE; --mloc-purple-deep: #8A66EA; --mloc-coral: #F0996F;
    --mloc-green: #46B87A; --mloc-amber: #E0B450; --mloc-red: #E86B5E;
    --mloc-branco: #201E28;
    --mloc-text2: #B9B4C6; --mloc-text3: #948FA3; --mloc-grid: #2A2833;
    --mloc-soft: rgba(255,255,255,0.07); --mloc-toggle-off: #3A3744;
    --mloc-quickaction: #2A2833;
    --mloc-toast: #3A3744;
    background: #17161C;
  }
}
/* Telas de entrada (Login e afins): sempre claras, não acompanham o tema. */
.mloc-sempre-claro {
  --mloc-ink: #1C1B22;  --mloc-paper: #F7F5F2;  --mloc-line: #E7E3DC;
  --mloc-purple: #5E2E97; --mloc-purple-deep: #6214A8; --mloc-coral: #E8825A;
  --mloc-green: #2E9E5B; --mloc-amber: #D9A227; --mloc-red: #D2483B;
  --mloc-branco: #FFFFFF;
  --mloc-text2: #6B6558; --mloc-text3: #736E63; --mloc-grid: #EDEAE2;
  --mloc-soft: #00000008; --mloc-toggle-off: #D8D3C8;
}
/* N0 é escuro por identidade, SEMPRE — independente do tema do usuário. Força o conjunto escuro de
   variáveis na subárvore inteira do painel administrativo. */
.mloc-forcar-escuro {
  --mloc-toast: #3A3744;
  --mloc-ink: #F2F0F5;  --mloc-paper: #17161C;  --mloc-line: #2E2C36;
  --mloc-purple: #8357DE; --mloc-purple-deep: #8A66EA; --mloc-coral: #F0996F;
  --mloc-green: #46B87A; --mloc-amber: #E0B450; --mloc-red: #E86B5E;
  --mloc-branco: #201E28;
  --mloc-text2: #B9B4C6; --mloc-text3: #948FA3; --mloc-grid: #2A2833;
  --mloc-soft: rgba(255,255,255,0.07); --mloc-toggle-off: #3A3744;
}
/* reset global de <button>: sem isso, botão sem background/color definidos rende fundo branco/texto preto
   do navegador, ignorando o tema. */
button { color: inherit; background: none; border: none; padding: 0; font: inherit; cursor: pointer; }
/* a cadeia de herança de cor precisa nascer da tinta do tema em cada escopo que redefine a variável. */
#root { color: var(--mloc-ink, #1C1B22); }
.mloc-forcar-escuro { color: var(--mloc-ink); }
.mloc-sempre-claro { color: var(--mloc-ink); }
    </style>

    <!-- PWA instalável (10/09/2026, Roteiro de Parametrização Morfo, G44
         regra 10) — arquivos reais copiados do Projeto Modelo
         (`manifest.json`/`manifest-claro.json`/`sw.js`/`icons/`), com os 3
         valores por-produto preenchidos (NOME_PRODUTO, descrição, APP_ID —
         ver `mapa-de-marca.md`). Só faz efeito no build NORMAL hospedado
         (`vite.config.ts` → `dist/`, servido por http/https) — o build de
         arquivo único (`vite.config.local.ts` → `dist-local/index.html`,
         aberto via `file://`) ignora isso sem quebrar nada: Service Worker é
         bloqueado por especificação em origem `file://` (já testado e
         documentado em `Manutencao.tsx`), e o link do manifest só não
         resolve — nenhum erro visível, nenhuma funcionalidade existente
         afetada. -->
    <link rel="manifest" href="manifest.json" id="manifest-link" />
    <script>
      // Troca manifest.json (escuro) por manifest-claro.json quando o
      // sistema está no tema claro — `<link rel="manifest">` não aceita
      // `media` query, então a troca é feita em runtime (mesmo padrão do
      // Kit pra tema claro/escuro do resto do app).
      (function () {
        try {
          var mq = window.matchMedia('(prefers-color-scheme: light)')
          var linkEl = document.getElementById('manifest-link')
          function aplicarManifest() {
            linkEl.setAttribute('href', mq.matches ? 'manifest-claro.json' : 'manifest.json')
          }
          aplicarManifest()
          mq.addEventListener('change', aplicarManifest)
        } catch (e) {
          /* navegador sem matchMedia — fica no manifest escuro padrão */
        }
      })()
    </script>
    <script>
      // Registra o Service Worker só quando faz sentido: precisa existir
      // (`'serviceWorker' in navigator`) e a origem não pode ser `file://`
      // (bloqueado por especificação — ver comentário acima). Sob o build
      // de arquivo único isso nunca roda; sob o build normal hospedado,
      // ativa o cache do app shell pra funcionar offline depois de
      // instalado.
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            /* falha de registro não deve travar o app carregando normalmente */
          })
        })
      }
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
